[package]
name = "routex"
version = "4.5.0"
description = "RouteX Tauri shell"
authors = ["Jarv1s0"]
edition = "2021"
rust-version = "1.95"
default-run = "routex"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23.1"
boa_engine = "0.22.0"
ctrlc = "3.5.2"
get_if_addrs = "0.5.3"
quick-xml = "0.42.0"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
thiserror = "2.0.21"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2.4.1"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
sysinfo = "0.39.6"
arboard = "3.7.0"
flate2 = "1.1.10"
open = "5.4.5"
rfd = "0.17.2"
lru = "0.19.0"

[target."cfg(any(target_os = \"windows\", target_os = \"macos\", target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Tauri v2 releases use native installers (Windows EXE/MSI, Linux DEB/RPM,
# macOS .app.tar.gz). Disable legacy Tauri v1 ZIP/AppImage archive support,
# which otherwise pulls in the vulnerable zip 4.x dependency on Windows.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
